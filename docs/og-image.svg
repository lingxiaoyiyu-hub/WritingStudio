<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  
  <circle cx="1100" cy="100" r="200" fill="#667eea" opacity="0.1"/>
  <circle cx="150" cy="550" r="180" fill="#764ba2" opacity="0.1"/>
  <circle cx="1000" cy="500" r="120" fill="#f093fb" opacity="0.08"/>
  
  <g transform="translate(100, 220)">
    <path d="M 0 50 L 0 -60 Q 0 -75 15 -75 L 90 -75 L 135 -30 L 135 50 Q 135 65 120 65 L 15 65 Q 0 65 0 50 Z" 
          fill="#ffffff" opacity="0.97" filter="url(#glow)"/>
    
    <path d="M 90 -75 L 135 -30 L 90 -30 Z" fill="#d0d0d0"/>
    
    <path d="M 20 -45 L 75 -45" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 20 -25 L 100 -25" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 20 -5 L 85 -5" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 20 15 L 110 15" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 20 35 L 70 35" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round"/>
    
    <g transform="translate(70, 10) rotate(-25)">
      <rect x="0" y="-8" width="80" height="16" rx="3" fill="url(#penGrad)"/>
      <polygon points="80,-8 105,0 80,8" fill="#2d3748"/>
      <rect x="-12" y="-10" width="16" height="20" rx="3" fill="#4a5568"/>
    </g>
  </g>
  
  <g transform="translate(350, 200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">WritingStudio</text>
    
    <rect x="0" y="30" width="300" height="6" rx="3" fill="url(#accentGrad)"/>
    
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="36" fill="#a0aec0">面向中文长篇小说的本地 AI 写作工作台</text>
    
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="180" height="50" rx="25" fill="url(#accentGrad)" opacity="0.2" stroke="url(#accentGrad)" stroke-width="2"/>
      <text x="90" y="33" font-family="Arial, sans-serif" font-size="22" fill="#a0aec0" text-anchor="middle">v3.5.0</text>
      
      <rect x="210" y="0" width="180" height="50" rx="25" fill="url(#accentGrad)" opacity="0.2" stroke="url(#accentGrad)" stroke-width="2"/>
      <text x="300" y="33" font-family="Arial, sans-serif" font-size="22" fill="#a0aec0" text-anchor="middle">MIT License</text>
      
      <rect x="420" y="0" width="220" height="50" rx="25" fill="url(#accentGrad)" opacity="0.2" stroke="url(#accentGrad)" stroke-width="2"/>
      <text x="530" y="33" font-family="Arial, sans-serif" font-size="22" fill="#a0aec0" text-anchor="middle">Windows / macOS / Linux</text>
    </g>
    
    <text x="0" y="260" font-family="Arial, sans-serif" font-size="24" fill="#718096">大纲推演 · 章节续写 · 角色记忆 · 质检润色 · 钩子爽点 · 自媒体创作</text>
  </g>
  
  <g transform="translate(100, 580)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#4a5568">github.com/lingxiaoyiyu-hub/WritingStudio</text>
  </g>
</svg>
